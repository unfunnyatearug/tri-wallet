name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release --features gui

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force dist
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\tri.nsi

      - name: Checksums
        run: |
          Copy-Item target\release\tri.exe dist\
          Copy-Item target\release\tri-gui.exe dist\
          Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        run: gh release create "$env:GITHUB_REF_NAME" dist\tri-setup.exe dist\tri.exe dist\tri-gui.exe dist\SHA256SUMS.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
