[package]
name = "tri"
version = "0.1.1"
edition = "2021"

[features]
default = []
# The GUI is optional so that a command line only build stays small.
gui = ["dep:eframe", "dep:qrcode"]

[[bin]]
name = "tri-gui"
required-features = ["gui"]

[dependencies]
anyhow = "1"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"], default-features = false }
bip39 = "2"
bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
ed25519-dalek = { version = "2", features = ["hazmat"] }
curve25519-dalek = "4"
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
rpassword = "7"
hex = "0.4"
zeroize = "1"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Used only by the tests, to verify signed transactions with the same
# consensus code the network runs.
bitcoin = { version = "0.32", features = ["bitcoinconsensus"] }

[workspace]
